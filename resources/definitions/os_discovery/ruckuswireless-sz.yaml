modules:
    sensors:
        state:
            data:
                -
                    oid: RUCKUS-CTRL-MIB::ruckusCTRLSystemNodeTable
                    value: RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeStatus
                    num_oid: '.1.3.6.1.4.1.25053.1.8.1.1.1.1.1.1.17.{{ $index }}'
                    index: '{{ $index_string }}'
                    descr: 'Node Status'
                    category: &nodes_category controller_nodes
                    group: &node_group '{{ RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeName }} ({{ $index_string }}, {{ RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeMgmtIp }})'
                    state_name: ruckusCtrlSystemNodeStatus
                    states:
                        - { value: 0, generic: 2, descr: out-of-service }
                        - { value: 8, generic: 0, descr: in-service }
                -
                    oid: RUCKUS-CTRL-MIB::ruckusCTRLSystemNodeTable
                    value: RUCKUS-CTRL-MIB::ruckusCtrlSystemClusterStatus
                    num_oid: '.1.3.6.1.4.1.25053.1.8.1.1.1.1.1.1.18.{{ $index }}'
                    index: '{{ $index_string }}'
                    descr: 'Cluster Status'
                    category: *nodes_category
                    group: *node_group
                    state_name: ruckusCtrlSystemClusterStatus
                    states:
                        - { value: 0, generic: 0, descr: in-service }
                        - { value: 1, generic: 2, descr: out-of-service }
                        - { value: 2, generic: 1, descr: maintenance }
                        - { value: 4, generic: 2, descr: network-partition-suspected }
                -
                    oid: RUCKUS-CTRL-MIB::ruckusCTRLSystemNodeTable
                    value: RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeClusterHAState
                    num_oid: '.1.3.6.1.4.1.25053.1.8.1.1.1.1.1.1.26.{{ $index }}'
                    index: '{{ $index_string }}'
                    descr: 'Cluster HA Status'
                    category: *nodes_category
                    group: *node_group
                    state_name: ruckusCtrlSystemNodeClusterHAState
                    states:
                        - { value: 1, generic: 0, descr: enabled }
                        - { value: 2, generic: 3, descr: disabled }
                -
                    oid: RUCKUS-CTRL-MIB::ruckusCTRLSystemNodeTable
                    value: RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeClusterHARoles
                    num_oid: '.1.3.6.1.4.1.25053.1.8.1.1.1.1.1.1.27.{{ $index }}'
                    index: '{{ $index_string }}'
                    descr: 'Cluster HA Role'
                    category: *nodes_category
                    group: *node_group
                    state_name: ruckusCtrlSystemNodeClusterHARoles
                    states:
                        - { value: 1, generic: 0, descr: active }
                        - { value: 2, generic: 0, descr: standby }
                        - { value: 3, generic: 3, descr: none }
        count:
            data:
                -
                    oid: RUCKUS-CTRL-MIB::ruckusCTRLSystemNodeTable
                    value: RUCKUS-CTRL-MIB::ruckusCtrlSystemNodeNumApLicense
                    num_oid: '.1.3.6.1.4.1.25053.1.8.1.1.1.1.1.1.10.{{ $index }}'
                    index: '{{ $index_string }}'
                    descr: 'AP Licenses'
                    category: &licenses_category ap_licenses
                    group: *node_group
                -
                    oid: RUCKUS-SZ-SYSTEM-MIB::ruckusSZSystemStatsNumAP
                    num_oid: '.1.3.6.1.4.1.25053.1.4.1.1.1.15.1.{{ $index }}'
                    index: 'consumed'
                    descr: 'AP Licenses Consumed'
                    category: *licenses_category
                    group: 'Cluster'
