name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/doc.yml'
      - 'doc/**'
      - 'resources/definitions/os_detection/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - '.github/workflows/doc.yml'
      - 'doc/**'
      - 'resources/definitions/os_detection/**'

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-slim
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /resources/definitions/os_detection
            /doc
      -
        name: Build docs
        run: pipx run --spec zensical==0.0.67 zensical build --clean --strict --config-file doc/zensical.toml
      -
        name: Check GitHub Pages status
        if: github.repository == 'librenms/librenms' && github.event_name != 'pull_request' && endsWith(github.ref, github.event.repository.default_branch)
        uses: crazy-max/ghaction-github-status@v5
        with:
          pages_threshold: major_outage
      -
        name: Deploy
        if: github.repository == 'librenms/librenms' && github.event_name != 'pull_request' && endsWith(github.ref, github.event.repository.default_branch)
        uses: crazy-max/ghaction-github-pages@v5
        with:
          repo: librenms/docs.librenms.org
          target_branch: main
          keep_history: true
          build_dir: doc/out
        env:
          GH_PAT: ${{ secrets.DOCS_TOKEN }}
