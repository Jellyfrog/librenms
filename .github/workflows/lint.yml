name: Lint
on:
  push:
  pull_request:
    branches: [master, main]

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    permissions:
      contents: read # to fetch code (actions/checkout)
      checks: write # to mark the status of each individual linter run

    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/

      - name: Lint Code Base
        uses: docker://ghcr.io/github/super-linter:slim-v4
        env:
          VALIDATE_BASH: true
          # VALIDATE_PHP_BUILTIN: true # temp disable until it supports PHP 8.1
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_BLACK: true

          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpstan:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/
            !/doc/

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

      - name: Composer dump
        run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts

      - name: Find new PHP files
        if: github.event_name == 'pull_request'
        id: new-files
        run: |
          # Deepen by 1 to fetch the merge commit's parents (base tip + PR head)
          git fetch --deepen=1 origin

          # HEAD is the PR merge commit, HEAD~1 is its first parent (base branch tip)
          # Diffing these two trees shows exactly what the PR introduces
          NEW_FILES=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- '*.php')
          echo "Discovered new PHP files:"
          echo "$NEW_FILES"
          echo "files=$(echo "$NEW_FILES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run PHPStan (New files, level 8)
        if: github.event_name == 'pull_request' && steps.new-files.outputs.files != ''
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --level=8 ${{ steps.new-files.outputs.files }}

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G

      - name: Run PHPStan (Legacy codebase)
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --configuration=phpstan-legacy.neon

      - name: Run PHPStan (Deprecated functions)
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --configuration=phpstan-deprecated.neon

  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/
            !/doc/

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

      - name: Composer dump
        run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts

      - name: Run Rector (dry-run)
        run: ./vendor/bin/rector process --dry-run --no-progress-bar --ansi --memory-limit=2G

