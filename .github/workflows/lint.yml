name: Lint
on:
  push:
  pull_request:
    branches: [master, main]

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    permissions:
      contents: read # to fetch code (actions/checkout)
      statuses: write # to mark the status of each individual linter run

    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          VALIDATE_BASH: true
          # VALIDATE_PHP_BUILTIN: true # temp disable until it supports PHP 8.1
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_BLACK: true

          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpstan:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> $GITHUB_OUTPUT

      # restore by prefix, hashFiles() needs the checkout so the exact key is saved after install
      - parallel:
          - name: Checkout Code
            uses: actions/checkout@v7
            with:
              fetch-depth: 2
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/
          - name: Restore composer cache
            id: composer-cache-restore
            uses: actions/cache/restore@v6
            with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-
              restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

      - name: Save composer cache
        if: ${{ !endsWith(steps.composer-cache-restore.outputs.cache-matched-key, hashFiles('composer.lock')) }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('composer.lock') }}

      - name: Composer dump
        run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts

      - name: Find new PHP files
        if: github.event_name == 'pull_request'
        id: new-php-files
        run: |
          # HEAD is the PR merge commit, HEAD~1 is its first parent (base branch tip)
          NEW_PHP_FILES=$(git diff -z --diff-filter=A --name-only HEAD~1 HEAD -- 'app/**.php' 'bootstrap/**.php' 'config/**.php' 'database/**.php' 'LibreNMS/**.php' 'resources/**.php' 'routes/**.php' 'tests/**.php' | xargs -0)
          echo "Discovered new PHP files: $NEW_PHP_FILES"
          echo "files=$NEW_PHP_FILES" >> "$GITHUB_OUTPUT"

      - name: Run PHPStan (New files, level 6)
        if: github.event_name == 'pull_request' && steps.new-php-files.outputs.files != ''
        env:
          NEW_PHP_FILES: ${{ steps.new-php-files.outputs.files }}
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --level=6 -- $NEW_PHP_FILES

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G

      - name: Run PHPStan (Legacy codebase)
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --configuration=phpstan-legacy.neon

      - name: Run PHPStan (Deprecated functions)
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --configuration=phpstan-deprecated.neon

  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> $GITHUB_OUTPUT

      # restore by prefix, hashFiles() needs the checkout so the exact key is saved after install
      - parallel:
          - name: Checkout Code
            uses: actions/checkout@v7
            with:
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/
          - name: Restore composer cache
            id: composer-cache-restore
            uses: actions/cache/restore@v6
            with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-
              restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

      - name: Save composer cache
        if: ${{ !endsWith(steps.composer-cache-restore.outputs.cache-matched-key, hashFiles('composer.lock')) }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('composer.lock') }}

      - name: Composer dump
        run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts

      - name: Run Rector (dry-run)
        run: ./vendor/bin/rector process --dry-run --no-progress-bar --ansi --memory-limit=2G

