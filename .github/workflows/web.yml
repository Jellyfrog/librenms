name: Web

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  dusk-php:
    runs-on: ubuntu-latest
    steps:
      - name: Start Database
        id: database
        background: true
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`librenms_phpunit_78hunjuybybh\` character set UTF8mb4 collate utf8mb4_bin;"

      # start checkout last, it can fail reading the event payload while other steps start
      - parallel:
          # outside the workspace, checkout empties it. Restore by prefix, hashFiles() needs
          # the checkout so the exact key is saved after install
          - name: Restore vendor
            id: vendor-cache
            # master builds install from scratch
            if: github.event_name != 'push'
            uses: actions/cache/restore@v6
            with:
              path: ~/vendor
              key: ${{ runner.os }}-vendor-web-${{ secrets.CACHE_VERSION }}-
              restore-keys: |
                ${{ runner.os }}-vendor-web-${{ secrets.CACHE_VERSION }}-

          - name: Checkout
            uses: actions/checkout@v7
            with:
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/

      - name: Init env
        run: |
          cat > .env <<EOL
          APP_KEY=
          APP_URL=http://127.0.0.1:8000
          APP_ENV=testing
          APP_DEBUG=true
          DB_HOST=127.0.0.1
          DB_DATABASE=librenms_phpunit_78hunjuybybh
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_TEST_HOST=127.0.0.1
          DB_TEST_DATABASE=librenms_phpunit_78hunjuybybh
          DB_TEST_USERNAME=root
          DB_TEST_PASSWORD=root
          MAIL_MAILER=log
          EOL

      - name: Setup SQLite
        run: sqlite3 database/testing.sqlite ""

      - name: Install Composer Dependencies
        run: |
          # composer brings a restored vendor in line with composer.lock
          if [ -d ~/vendor ]; then mv ~/vendor vendor; fi
          composer install --no-progress --prefer-dist --optimize-autoloader

      # the cache path must be the same as on restore
      - name: Copy vendor for cache
        if: ${{ github.event_name != 'push' && !endsWith(steps.vendor-cache.outputs.cache-matched-key, hashFiles('composer.lock')) }}
        run: cp -a vendor ~/vendor

      - name: Save vendor
        if: ${{ github.event_name != 'push' && !endsWith(steps.vendor-cache.outputs.cache-matched-key, hashFiles('composer.lock')) }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ~/vendor
          key: ${{ runner.os }}-vendor-web-${{ secrets.CACHE_VERSION }}-${{ hashFiles('composer.lock') }}

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Start Chrome Driver
        id: chromedriver
        background: true
        run: |
          php artisan dusk:chrome-driver --detect
          # detach output, the step would wait for it to close
          nohup ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > /tmp/chromedriver.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9515/status > /dev/null; do sleep 0.2; done'

      - name: Wait for Database
        wait: database

      - name: Migrate Database
        run: php artisan migrate --database=testing

      - name: Run Laravel Server
        run: |
          nohup php artisan serve --no-reload > /tmp/serve.log 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 0.2; done'

      - name: Wait for Chrome Driver
        wait: chromedriver

      - name: Run Dusk Tests
        run: php artisan dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: tests/Browser/console
