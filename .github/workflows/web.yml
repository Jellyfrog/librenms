name: Web

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  dusk-php:
    runs-on: ubuntu-latest
    steps:
      # restore by prefix, hashFiles() needs the checkout so the exact key is saved after install
      - name: Restore composer cache
        id: composer-cache-restore
        background: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-
          restore-keys: ${{ runner.os }}-composer-

      - name: Create Database
        id: database
        background: true
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`librenms_phpunit_78hunjuybybh\` character set UTF8mb4 collate utf8mb4_bin;"

      # start checkout last, it can fail reading the event payload while other steps start
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/
            !/doc/

      - name: Wait for composer cache
        wait: composer-cache-restore

      - name: Init env
        run: |
          cat > .env <<EOL
          APP_KEY=base64:vHI+YHgkyCDad31iPEErGSNEOWO21wNzV+zyENKQv04=
          APP_URL=http://127.0.0.1:8000
          NODE_ID=ci
          APP_ENV=testing
          APP_DEBUG=true
          DB_HOST=127.0.0.1
          DB_DATABASE=librenms_phpunit_78hunjuybybh
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_TEST_HOST=127.0.0.1
          DB_TEST_DATABASE=librenms_phpunit_78hunjuybybh
          DB_TEST_USERNAME=root
          DB_TEST_PASSWORD=root
          MAIL_MAILER=log
          EOL

      - name: Setup SQLite
        run: sqlite3 database/testing.sqlite ""

      # skip the production cache warm-up scripts (view:cache, optimize), test.yml runs them
      - name: Install Composer Dependencies
        run: |
          composer install --no-progress --prefer-dist --no-scripts
          php artisan package:discover

      - name: Save composer cache
        if: ${{ !endsWith(steps.composer-cache-restore.outputs.cache-matched-key, hashFiles('composer.lock')) }}
        background: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Run Laravel Server
        id: server
        background: true
        run: |
          # detach output, the step would wait for it to close
          php artisan serve --no-reload > /tmp/server.log 2>&1 &
          timeout 60 bash -c 'until curl -so /dev/null http://127.0.0.1:8000; do sleep 0.1; done'

      - name: Wait for database
        wait: database

      - parallel:
          - name: Migrate Database
            run: php artisan migrate --database=testing

          - name: Upgrade Chrome Driver
            run: php artisan dusk:chrome-driver --detect

          - name: Generate JS translations
            run: php artisan vue-i18n:generate --multi-locales --format=umd

      - name: Start Chrome Driver
        id: chromedriver
        background: true
        run: |
          # detach output, the step would wait for it to close
          ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > /tmp/chromedriver.log 2>&1 &
          timeout 60 bash -c 'until curl -so /dev/null http://127.0.0.1:9515/status; do sleep 0.1; done'

      - name: Wait for Chrome Driver and Laravel Server
        wait: [chromedriver, server]

      - name: Run Dusk Tests
        run: echo php artisan dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: tests/Browser/console

      - name: Upload LibreNMS Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: librenms-logs
          path: logs/librenms.log
