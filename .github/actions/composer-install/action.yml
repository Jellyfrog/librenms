name: 'Composer Install'
description: 'Install PHP dependencies using Composer including caching'

inputs:
  cache-version:
    description: 'Cache version key for Composer dependency cache'
    required: true
  dump-autoload:
    description: 'Generate the Composer autoloader'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Get composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    # vendor is installed with the active PHP, keep a vendor cache per PHP version
    - name: Get PHP version
      id: php-version
      shell: bash
      run: echo "version=$(php -r 'echo PHP_VERSION_ID;')" >> $GITHUB_OUTPUT

    - name: Cache composer cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ inputs.cache-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-${{ inputs.cache-version }}-

    - name: Cache vendor directory
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-vendor-php${{ steps.php-version.outputs.version }}-${{ inputs.cache-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-vendor-php${{ steps.php-version.outputs.version }}-${{ inputs.cache-version }}-

    - name: Composer install
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

    - name: Composer dump-autoload
      if: inputs.dump-autoload == 'true'
      shell: bash
      run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts
