[project.theme]
language = "en"
logo = "img/librenms.svg"

features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.share",
]

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to light mode"

[project.extra]
article_nav_top = false
article_nav_bottom = true

[project.extra.php]
version_min = "8.2"

[project.extra.analytics]
provider = "google"
property = "G-K0B7KB9765"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/librenms/"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/librenms/librenms"
name = "Docker"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/librenms"
name = "Discord"

[[project.extra.social]]
icon = "fontawesome/brands/reddit"
link = "https://www.reddit.com/r/LibreNMS/"
name = "Reddit"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/librenms"
name = "Twitter"

[[project.extra.social]]
icon = "fontawesome/brands/facebook"
link = "https://www.facebook.com/LibreNMS"
name = "Facebook"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/librenms/"
name = "LinkedIn"

# Markdown extensions
[project.markdown_extensions.tables]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.tasklist]

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]

[[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang]]
name = "php"
lang = "php"

[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang.options]
startinline = true

# Former mkdocs.yml plugins now handled by scripts/docs-pre-build.sh:
# - macros -> envsubst for ${PHP_VERSION_MIN}, ${SITE_URL}
# - markdown-exec -> vendor list generated to doc/Support/vendors.md
# - include_dir_to_nav -> nav entries expanded explicitly above
# - redirects -> HTML meta-refresh pages generated into out/
# Dropped (not needed):
# - exclude -> only nav-referenced files are built
# - minify -> negligible with CDN gzip
